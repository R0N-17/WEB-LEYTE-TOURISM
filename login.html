<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script src="../js/theme-init.js"></script>
  <title>Admin Log in</title>
  <link href="../css/fonts.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
  <link href="css/login.css" rel="stylesheet">
</head>
<body class="admin-body" data-no-theme-fab>
<main class="ad-login">
  <div class="ad-login-card">
    <div class="lg-brand">
      <span class="lg-logo">
        <img src="../images/logo-compass.svg" alt="" width="34" height="34">
        <span class="lg-logo-text">Leyte Tourism Guide</span>
      </span>
      <span class="badge-admin">Admin console</span>
      <button type="button" class="lg-theme" data-theme-toggle aria-label="Switch theme">
        <svg class="i-sun" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/></svg>
        <svg class="i-moon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278M4.858 1.311A7.27 7.27 0 0 0 1.025 7.71c0 4.02 3.279 7.276 7.319 7.276a7.32 7.32 0 0 0 5.205-2.162q-.506.063-1.029.063c-4.61 0-8.343-3.714-8.343-8.29 0-1.167.242-2.278.681-3.286"/></svg>
      </button>
    </div>
    <h1>Welcome back</h1>
    <p class="lg-sub">Sign In. <br> For authorized Staff only.</p>

    <div id="formAlert" class="alert d-none" role="alert" aria-live="polite"></div>

    <form id="adminLoginForm" novalidate>
      <div class="lg-field">
        <label class="lg-label" for="email">Email</label>
        <input type="email" class="lg-input" id="email" autocomplete="username" placeholder="Email" aria-describedby="emailErr" required>
        <p class="lg-err d-none" id="emailErr" role="alert"></p>
      </div>
      <div class="lg-field">
        <label class="lg-label" for="password">Password</label>
        <div class="lg-wrap">
          <input type="password" class="lg-input" id="password" autocomplete="current-password" aria-describedby="pwErr" required>
          <button type="button" class="lg-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path id="eyeOn" d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.17 8a13 13 0 0 1 1.66-2.04C4.12 4.67 5.88 3.5 8 3.5s3.88 1.17 5.17 2.46A13 13 0 0 1 14.83 8a13 13 0 0 1-1.66 2.04C11.88 11.33 10.12 12.5 8 12.5s-3.88-1.17-5.17-2.46A13 13 0 0 1 1.17 8"/><path id="eyeOn2" d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/></svg>
          </button>
        </div>
        <p class="lg-err d-none" id="pwErr" role="alert"></p>
      </div>
      <button type="submit" class="lg-btn" id="loginBtn">Sign in</button>
    </form>
    <p class="lg-back"><a href="../login.html">&larr; Back to the public site</a></p>
  </div>
</main>

<script src="../js/theme.js"></script>
<script src="js/admin.js"></script>
<script>
(function () {
  const box = document.getElementById('formAlert');
  const show = (type, msg) => { box.className = 'alert alert-' + type; box.textContent = msg; };
  const q = new URLSearchParams(location.search);
  if (q.has('denied')) show('warning', 'That account is not an administrator. Sign in with an admin account.');
  else if (q.has('expired')) show('info', 'Please sign in to continue.');

  // Already signed in as an admin? Go straight to the dashboard.
  Admin.api('me.php', {}, { noRedirect: true }).then(r => { if (r.ok) location.replace('index.html'); });

  const emailEl = document.getElementById('email'), pwEl = document.getElementById('password');
  const fieldError = (input, id, msg) => { const p = document.getElementById(id); p.textContent = msg; p.classList.toggle('d-none', !msg); input.setAttribute('aria-invalid', msg ? 'true' : 'false'); };
  emailEl.addEventListener('input', () => fieldError(emailEl, 'emailErr', ''));
  pwEl.addEventListener('input', () => fieldError(pwEl, 'pwErr', ''));
  document.getElementById('pwToggle').addEventListener('click', function () {
    const show = pwEl.type === 'password';
    pwEl.type = show ? 'text' : 'password';
    this.setAttribute('aria-pressed', String(show)); this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  let busy = false;   // a second click or Enter while signing in does nothing
  document.getElementById('adminLoginForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (busy) return;
    const email = emailEl.value.trim(), password = pwEl.value;
    fieldError(emailEl, 'emailErr', email ? (/^\S+@\S+\.\S+$/.test(email) ? '' : 'Enter a valid email address.') : 'Enter your email.');
    fieldError(pwEl, 'pwErr', password ? '' : 'Enter your password.');
    if (!email || !password || !/^\S+@\S+\.\S+$/.test(email)) { (!email || !/^\S+@\S+\.\S+$/.test(email) ? emailEl : pwEl).focus(); return; }
    busy = true;
    const btn = document.getElementById('loginBtn');
    Admin.loading(btn, true, 'Signing in…');
    const res = await Admin.api('login.php', { email, password }, { noRedirect: true });
    if (res.ok) { location.replace('index.html'); return; }
    busy = false;
    Admin.loading(btn, false);
    show('danger', res.message || 'Could not sign in. Try again.');
  });
})();
</script>
</body>
</html>
